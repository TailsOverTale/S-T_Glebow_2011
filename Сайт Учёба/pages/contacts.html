<div class="main">

    <h1>Контакты</h1>

    <form class="contact-form">

        <p>Как Вам удобно получить ответ?</p>

        <div class="radio-group">
            <label><input type="radio" name="answer" value="email"> по почте</label>
            <label><input type="radio" name="answer" value="phone"> по телефону</label>
            <label><input type="radio" name="answer" value="none"> не нужно отвечать</label>
        </div>

        <p>Укажите тему вопроса</p>
        <select name="subject">
            <option value="work">Работа</option>
            <option value="study">Учёба</option>
            <option value="cooperation">Сотрудничество</option>
            <option value="other">Другое</option>
        </select>

        <p>Ещё один вопрос?</p>

        <div class="checkbox-group">
            <label><input type="checkbox" name="question1"> может так</label>
            <label><input type="checkbox" name="question2"> или не так</label>
            <label><input type="checkbox" name="question3"> иначе</label>
        </div>

        <div class="row">
            <label for="name">Ваше имя:</label>
            <input type="text" name="name" id="name">
        </div>

        <div class="row">
            <label for="email">Адрес почты:</label>
            <input type="email" name="email" id="email">
        </div>

        <div class="row">
            <label for="phone">Телефон:</label>
            <input type="tel" name="phone" id="phone">
        </div>

        <p>Ваш вопрос:</p>
        <textarea name="message" id="message" rows="5"></textarea>

        <input type="submit" value="Отправить вопрос">

    </form>

    <h2>Социальные сети</h2>

    <div class="social">
